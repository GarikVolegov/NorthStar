<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Background circle -->
  <circle cx="60" cy="60" r="60" fill="#111111"/>

  <!-- Outer compass ring -->
  <circle cx="60" cy="60" r="50" stroke="#4ade80" stroke-width="1.5" opacity="0.25"/>

  <!-- Compass tick marks (N/S/E/W) -->
  <line x1="60" y1="10" x2="60" y2="18" stroke="#4ade80" stroke-width="2" stroke-linecap="round"/>
  <line x1="60" y1="102" x2="60" y2="110" stroke="#4ade80" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="10" y1="60" x2="18" y2="60" stroke="#4ade80" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="102" y1="60" x2="110" y2="60" stroke="#4ade80" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>

  <!-- Diagonal ticks -->
  <line x1="22" y1="22" x2="27" y2="27" stroke="#4ade80" stroke-width="1" stroke-linecap="round" opacity="0.25"/>
  <line x1="93" y1="93" x2="98" y2="98" stroke="#4ade80" stroke-width="1" stroke-linecap="round" opacity="0.25"/>
  <line x1="93" y1="22" x2="98" y2="27" stroke="#4ade80" stroke-width="1" stroke-linecap="round" opacity="0.25"/>
  <line x1="22" y1="93" x2="27" y2="98" stroke="#4ade80" stroke-width="1" stroke-linecap="round" opacity="0.25"/>

  <!-- 4-pointed North Star / Polaris shape -->
  <!-- Main vertical spire (tall, sharp) -->
  <path d="M60 14 L63.5 56 L60 60 L56.5 56 Z" fill="#4ade80"/>
  <!-- Main horizontal spire -->
  <path d="M106 60 L64 63.5 L60 60 L64 56.5 Z" fill="#4ade80" opacity="0.55"/>
  <!-- South spire -->
  <path d="M60 106 L56.5 64 L60 60 L63.5 64 Z" fill="#4ade80" opacity="0.55"/>
  <!-- West spire -->
  <path d="M14 60 L56 56.5 L60 60 L56 63.5 Z" fill="#4ade80" opacity="0.55"/>

  <!-- Diagonal secondary rays (shorter, thin) -->
  <path d="M60 60 L85 35 L62 58 Z" fill="#4ade80" opacity="0.2"/>
  <path d="M60 60 L85 85 L62 62 Z" fill="#4ade80" opacity="0.2"/>
  <path d="M60 60 L35 85 L58 62 Z" fill="#4ade80" opacity="0.2"/>
  <path d="M60 60 L35 35 L58 58 Z" fill="#4ade80" opacity="0.2"/>

  <!-- Center dot -->
  <circle cx="60" cy="60" r="7" fill="#111111"/>
  <circle cx="60" cy="60" r="4" fill="#4ade80"/>

  <!-- N cardinal indicator (north) -->
  <text x="60" y="9" font-family="system-ui, sans-serif" font-size="7" font-weight="bold" fill="#4ade80" text-anchor="middle" opacity="0.9">N</text>
</svg>
