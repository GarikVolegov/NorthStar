openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Orientamento SaaS API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: sectors
    description: Sector and career data
  - name: test
    description: Personality test operations
  - name: users
    description: User registration
  - name: calendar
    description: Calendar events and reminders
  - name: notifications
    description: In-app notifications
  - name: push
    description: Browser push notification subscriptions
  - name: wendy
    description: Wendy AI coaching assistant

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
        message:
          type: string
      required:
        - error

    Sector:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        riasecTypes:
          type: array
          items:
            type: string
        skills:
          type: array
          items:
            type: string
        avgSalaryMin:
          type: integer
        avgSalaryMax:
          type: integer
        growthRate:
          type: number
        automationRisk:
          type: string
          enum: [low, medium, high]
        scalability:
          type: string
          enum: [low, medium, high]
        trend:
          type: string
          enum: [declining, stable, growing, booming]
        timeToAutonomy:
          type: string
        advantages:
          type: array
          items:
            type: string
        disadvantages:
          type: array
          items:
            type: string
        opportunities:
          type: array
          items:
            type: string
        icon:
          type: string
        color:
          type: string
        createdAt:
          type: string
      required:
        - id
        - name
        - description
        - riasecTypes
        - skills
        - avgSalaryMin
        - avgSalaryMax
        - growthRate
        - automationRisk
        - scalability
        - trend
        - timeToAutonomy
        - advantages
        - disadvantages
        - opportunities
        - icon
        - color
        - createdAt

    SectorRecommendation:
      type: object
      properties:
        sectorId:
          type: integer
        sectorName:
          type: string
        matchScore:
          type: number
        matchReason:
          type: string
        sector:
          $ref: "#/components/schemas/Sector"
      required:
        - sectorId
        - sectorName
        - matchScore
        - matchReason
        - sector

    RoleSummary:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        skills:
          type: array
          items:
            type: string
        workModes:
          type: array
          items:
            type: string
        riasecFit:
          type: array
          items:
            type: string
        salaryRange:
          type: string
        growthOutlook:
          type: string
        autonomyScore:
          type: ["integer", "null"]
        stabilityScore:
          type: ["integer", "null"]
      required:
        - id
        - title
        - skills
        - workModes
        - riasecFit
        - salaryRange
        - growthOutlook

    EducationPathSummary:
      type: object
      properties:
        id:
          type: integer
        path:
          type: string
        type:
          type: string
        duration:
          type: string
        cost:
          type: string
        steps:
          type: array
          items:
            type: string
        careerOutcomes:
          type: array
          items:
            type: string
      required:
        - id
        - path
        - type
        - duration
        - cost
        - steps
        - careerOutcomes

    SectorInfo:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        icon:
          type: string
        color:
          type: string
      required:
        - id
        - name
        - icon
        - color

    RoleDetail:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        sector:
          type: string
        sectorId:
          type: ["integer", "null"]
        sectorInfo:
          oneOf:
            - $ref: "#/components/schemas/SectorInfo"
            - type: "null"
        riasecFit:
          type: array
          items:
            type: string
        skills:
          type: array
          items:
            type: string
        workModes:
          type: array
          items:
            type: string
        salaryRange:
          type: string
        growthOutlook:
          type: string
        autonomyScore:
          type: ["integer", "null"]
        stabilityScore:
          type: ["integer", "null"]
        educationPaths:
          type: array
          items:
            $ref: "#/components/schemas/EducationPathSummary"
      required:
        - id
        - title
        - sector
        - riasecFit
        - skills
        - workModes
        - salaryRange
        - growthOutlook
        - educationPaths

    TestSession:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: ["integer", "null"]
        answers:
          type: object
          additionalProperties: true
        riasecScores:
          type: object
          additionalProperties: true
        primaryTypes:
          type: array
          items:
            type: string
        profileSummary:
          type: string
        recommendations:
          type: array
          items:
            $ref: "#/components/schemas/SectorRecommendation"
        confirmedSectorId:
          type: ["integer", "null"]
        createdAt:
          type: string
      required:
        - id
        - answers
        - riasecScores
        - primaryTypes
        - profileSummary
        - recommendations
        - createdAt

    SubmitTestBody:
      type: object
      properties:
        answers:
          type: object
          additionalProperties:
            type: integer
          description: Map of question ID to answer value (1-5)
        name:
          type: ["string", "null"]
      required:
        - answers

    ConfirmSectorBody:
      type: object
      properties:
        sectorId:
          type: integer
      required:
        - sectorId

    RegisterUserBody:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        testSessionId:
          type: ["integer", "null"]
      required:
        - name
        - email

    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        testSessionId:
          type: ["integer", "null"]
        createdAt:
          type: string
      required:
        - id
        - name
        - email
        - createdAt

    CalendarEvent:
      type: object
      properties:
        id: { type: integer }
        userId: { type: integer }
        title: { type: string }
        description: { type: ["string", "null"] }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        allDay: { type: boolean }
        category: { type: string, enum: [study, training, interview, deadline, task, follow-up] }
        priority: { type: string, enum: [low, medium, high] }
        status: { type: string, enum: [todo, in-progress, done, postponed] }
        color: { type: ["string", "null"] }
        tags: { type: array, items: { type: string } }
        linkedSectorId: { type: ["integer", "null"] }
        linkedGoal: { type: ["string", "null"] }
        linkedContentIds: { type: array, items: { type: integer } }
        isRecurring: { type: boolean }
        recurrenceRule: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        reminders: { type: array, items: { $ref: "#/components/schemas/EventReminder" } }
      required: [id, userId, title, startAt, endAt, allDay, category, priority, status, createdAt, updatedAt]

    EventReminder:
      type: object
      properties:
        id: { type: integer }
        eventId: { type: integer }
        minutesBefore: { type: integer }
        enabled: { type: boolean }
        sentAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
      required: [id, eventId, minutesBefore, enabled, createdAt]

    NotificationLog:
      type: object
      properties:
        id: { type: integer }
        userId: { type: integer }
        eventId: { type: ["integer", "null"] }
        channel: { type: string }
        title: { type: string }
        body: { type: ["string", "null"] }
        isRead: { type: boolean }
        sentAt: { type: string, format: date-time }
        openedAt: { type: ["string", "null"], format: date-time }
      required: [id, userId, channel, title, isRead, sentAt]

    CreateCalendarEventBody:
      type: object
      properties:
        title: { type: string, maxLength: 200 }
        description: { type: ["string", "null"] }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        allDay: { type: boolean, default: false }
        category: { type: string, enum: [study, training, interview, deadline, task, follow-up], default: task }
        priority: { type: string, enum: [low, medium, high], default: medium }
        status: { type: string, enum: [todo, in-progress, done, postponed], default: todo }
        color: { type: ["string", "null"] }
        tags: { type: array, items: { type: string } }
        linkedSectorId: { type: ["integer", "null"] }
        linkedGoal: { type: ["string", "null"] }
        linkedContentIds: { type: array, items: { type: integer } }
        isRecurring: { type: boolean, default: false }
        recurrenceRule: { type: ["string", "null"] }
        reminders:
          type: array
          maxItems: 4
          items:
            type: object
            properties:
              minutesBefore: { type: integer }
              enabled: { type: boolean }
            required: [minutesBefore]
      required: [title, startAt, endAt]

    UpdateCalendarEventBody:
      type: object
      properties:
        title: { type: string }
        description: { type: ["string", "null"] }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        allDay: { type: boolean }
        category: { type: string, enum: [study, training, interview, deadline, task, follow-up] }
        priority: { type: string, enum: [low, medium, high] }
        status: { type: string, enum: [todo, in-progress, done, postponed] }
        color: { type: ["string", "null"] }
        tags: { type: array, items: { type: string } }
        linkedSectorId: { type: ["integer", "null"] }
        linkedGoal: { type: ["string", "null"] }
        linkedContentIds: { type: array, items: { type: integer } }
        reminders:
          type: array
          maxItems: 4
          items:
            type: object
            properties:
              minutesBefore: { type: integer }
              enabled: { type: boolean }
            required: [minutesBefore]

    CalendarQuota:
      type: object
      properties:
        isPremium: { type: boolean }
        eventCount: { type: integer }
        eventLimit: { type: ["integer", "null"] }
      required: [isPremium, eventCount, eventLimit]

    StatsSummary:
      type: object
      properties:
        totalSectors:
          type: integer
        totalTestsTaken:
          type: integer
        topSectors:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              count:
                type: integer
            required:
              - name
              - count
        avgGrowthRate:
          type: number
      required:
        - totalSectors
        - totalTestsTaken
        - topSectors
        - avgGrowthRate

    SectorStats:
      type: object
      properties:
        sectorId:
          type: integer
        timesPicked:
          type: integer
        avgMatchScore:
          type: number
        salaryRange:
          type: string
        growthProjection:
          type: object
          properties:
            shortTerm:
              type: string
            midTerm:
              type: string
            longTerm:
              type: string
          required:
            - shortTerm
            - midTerm
            - longTerm
      required:
        - sectorId
        - timesPicked
        - avgMatchScore
        - salaryRange
        - growthProjection

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /sectors:
    get:
      operationId: listSectors
      tags: [sectors]
      summary: List all sectors
      responses:
        "200":
          description: List of sectors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sector"

  /sectors/{id}:
    get:
      operationId: getSector
      tags: [sectors]
      summary: Get sector details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Sector details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sector"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /test-sessions:
    post:
      operationId: submitTest
      tags: [test]
      summary: Submit personality test and get recommendations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitTestBody"
      responses:
        "201":
          description: Test result with personality profile and sector recommendations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestSession"
        "400":
          description: Invalid answers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /test-sessions/{id}:
    get:
      operationId: getTestSession
      tags: [test]
      summary: Get a test session result
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Test session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestSession"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /test-sessions/{id}/confirm:
    post:
      operationId: confirmSector
      tags: [test]
      summary: Confirm a sector choice from the test results
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmSectorBody"
      responses:
        "200":
          description: Updated test session with confirmed sector
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestSession"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users:
    post:
      operationId: registerUser
      tags: [users]
      summary: Register a user to save test results
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterUserBody"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stats/summary:
    get:
      operationId: getStatsSummary
      tags: [sectors]
      summary: Get platform stats summary
      responses:
        "200":
          description: Platform statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsSummary"

  /sectors/{id}/stats:
    get:
      operationId: getSectorStats
      tags: [sectors]
      summary: Get detailed stats for a sector
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Sector statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectorStats"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sectors/{id}/roles:
    get:
      operationId: getSectorRoles
      tags: [sectors]
      summary: List roles (professions) belonging to a sector
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of roles for the sector
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoleSummary"
        "404":
          description: Sector not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /roles/{id}:
    get:
      operationId: getRoleDetail
      tags: [sectors]
      summary: Get full details for a single role including linked education paths
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Role detail with education paths
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleDetail"
        "404":
          description: Role not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /calendar/quota:
    get:
      operationId: getCalendarQuota
      tags: [calendar]
      summary: Get the authenticated user's plan quota and event count
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Quota information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarQuota"

  /calendar/events:
    get:
      operationId: listCalendarEvents
      tags: [calendar]
      summary: List events for the authenticated user within a date range
      security:
        - bearerAuth: []
      parameters:
        - { name: from, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: List of events with reminders
          content:
            application/json:
              schema:
                type: object
                properties:
                  events: { type: array, items: { $ref: "#/components/schemas/CalendarEvent" } }
                required: [events]
    post:
      operationId: createCalendarEvent
      tags: [calendar]
      summary: Create a new calendar event
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCalendarEventBody" }
      responses:
        "201":
          description: Created event
          content:
            application/json:
              schema:
                type: object
                properties:
                  event: { $ref: "#/components/schemas/CalendarEvent" }
                required: [event]
        "403":
          description: Free tier limit reached or premium reminder required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /calendar/events/{id}:
    get:
      operationId: getCalendarEvent
      tags: [calendar]
      summary: Get a single event (must own it)
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Event with reminders
          content:
            application/json:
              schema:
                type: object
                properties:
                  event: { $ref: "#/components/schemas/CalendarEvent" }
                required: [event]
        "404": { description: Not found }
    put:
      operationId: updateCalendarEvent
      tags: [calendar]
      summary: Update an event (must own it)
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCalendarEventBody" }
      responses:
        "200":
          description: Updated event
          content:
            application/json:
              schema:
                type: object
                properties:
                  event: { $ref: "#/components/schemas/CalendarEvent" }
                required: [event]
        "403":
          description: Premium reminder required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404": { description: Not found }
    delete:
      operationId: deleteCalendarEvent
      tags: [calendar]
      summary: Delete an event (must own it)
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                required: [success]

  /calendar/events/{id}/reminders:
    post:
      operationId: addEventReminder
      tags: [calendar]
      summary: Add a reminder to an event
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                minutesBefore: { type: integer }
                enabled: { type: boolean }
              required: [minutesBefore]
      responses:
        "201":
          description: Created reminder
          content:
            application/json:
              schema:
                type: object
                properties:
                  reminder: { $ref: "#/components/schemas/EventReminder" }
                required: [reminder]
        "403":
          description: Premium reminder required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /calendar/reminders/{id}:
    put:
      operationId: updateEventReminder
      tags: [calendar]
      summary: Update a reminder
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                minutesBefore: { type: integer }
                enabled: { type: boolean }
      responses:
        "200":
          description: Updated reminder
        "403":
          description: Premium reminder required
    delete:
      operationId: deleteEventReminder
      tags: [calendar]
      summary: Delete a reminder
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Deleted

  /calendar/upcoming:
    get:
      operationId: getUpcomingEvents
      tags: [calendar]
      summary: Get upcoming events for the authenticated user
      security:
        - bearerAuth: []
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, default: 5, maximum: 20 } }
      responses:
        "200":
          description: Upcoming events
          content:
            application/json:
              schema:
                type: object
                properties:
                  events: { type: array, items: { $ref: "#/components/schemas/CalendarEvent" } }
                required: [events]

  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List in-app notifications for the authenticated user
      security:
        - bearerAuth: []
      parameters:
        - { name: unread, in: query, required: false, schema: { type: boolean } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 20 } }
      responses:
        "200":
          description: Notifications list with unread count
          content:
            application/json:
              schema:
                type: object
                properties:
                  notifications: { type: array, items: { $ref: "#/components/schemas/NotificationLog" } }
                  unreadCount: { type: integer }
                required: [notifications, unreadCount]

  /notifications/{id}/read:
    post:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark a notification as read
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Marked as read

  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all notifications as read for the authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: All marked as read

  /push/subscribe:
    post:
      operationId: subscribePush
      tags: [push]
      summary: Register a browser push subscription for the authenticated user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                endpoint: { type: string, format: uri }
                p256dh: { type: string }
                auth: { type: string }
              required: [endpoint, p256dh, auth]
      responses:
        "201":
          description: Subscription registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                required: [success]

  /push/unsubscribe:
    delete:
      operationId: unsubscribePush
      tags: [push]
      summary: Remove a browser push subscription for the authenticated user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                endpoint: { type: string }
              required: [endpoint]
      responses:
        "200":
          description: Subscription removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                required: [success]

  /ai/wendy:
    post:
      operationId: wendyChat
      tags: [wendy]
      summary: Send a message to Wendy (AI coaching assistant) with SSE streaming response
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  description: User message to Wendy
                sessionId:
                  type: string
                  description: Conversation session identifier
                clerkId:
                  type: string
                  description: Clerk user identifier
                context:
                  type: object
                  description: Optional additional context (page, sector, etc.)
              required: [message]
      responses:
        "200":
          description: SSE stream of Wendy response chunks
          content:
            text/event-stream:
              schema:
                type: string
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ai/wendy/feedback:
    post:
      operationId: wendyFeedback
      tags: [wendy]
      summary: Submit feedback (upvote/downvote) on a Wendy response
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                requestId:
                  type: string
                  description: ID of the Wendy request being rated
                rating:
                  type: string
                  enum: [up, down]
                reason:
                  type: string
                  enum: [inaccurate, irrelevant, too_long, too_slow, harmful, other]
                intent:
                  type: string
                domain:
                  type: string
                toolsUsed:
                  type: array
                  items:
                    type: string
              required: [requestId, rating]
      responses:
        "200":
          description: Feedback recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                required: [ok]

  /wendy/voice:
    post:
      operationId: wendyVoice
      tags: [wendy]
      summary: Generate text-to-speech audio for a Wendy response
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                  description: Text to synthesize as audio
              required: [text]
      responses:
        "200":
          description: Audio stream (mp3)
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
