# NorthStar — Docker Compose
# Usage:   docker compose up --build
# Dev:     docker compose up postgres           (solo DB locale)
# Full:    docker compose up --build
# Nuovo server only: docker compose up postgres northstar-server
#
# Servizi:
#   postgres          — PostgreSQL 16
#   redis             — Cache Redis per endpoint frequenti
#   ai-agents         — Microservizio Python AI (porta 8000)
#   api-server        — Express server legacy    (porta 8080, artifacts/)
#   northstar-server  — Express server nuovo     (porta 3001, apps/server/)
#   frontend          — React frontend           (porta 5000)
#   jaeger            — Distributed tracing UI   (porta 16686)

services:

  # ─── PostgreSQL ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-northstar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB:       ${POSTGRES_DB:-northstar}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U northstar"]
      interval: 5s
      timeout:  5s
      retries:  5

  # ─── Redis Cache ──────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    healthcheck:
      test:     ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout:  5s
      retries:  5

  # ─── Python AI Microservice ──────────────────────────────────────────────
  ai-agents:
    build:
      context:    ./artifacts/ai-agents
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - AI_INTEGRATIONS_OPENAI_API_KEY=${AI_INTEGRATIONS_OPENAI_API_KEY}
      - AI_INTEGRATIONS_OPENAI_BASE_URL=${AI_INTEGRATIONS_OPENAI_BASE_URL}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
    healthcheck:
      test:         ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval:     10s
      timeout:      5s
      retries:      5
      start_period: 15s

  # ─── Express API Server (legacy — artifacts/) ──────────────────────────
  api-server:
    build:
      context:    .
      dockerfile: artifacts/api-server/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT:                   8080
      NODE_ENV:               development
      DATABASE_URL:           postgresql://${POSTGRES_USER:-northstar}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-northstar}
      AI_AGENTS_URL:          http://ai-agents:8000
      JWT_SECRET:             ${JWT_SECRET}
      ADMIN_KEY:              ${ADMIN_KEY}
      STRIPE_SECRET_KEY:      ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET:  ${STRIPE_WEBHOOK_SECRET:-}
      GNEWS_API_KEY:          ${GNEWS_API_KEY:-}
      TAVILY_API_KEY:         ${TAVILY_API_KEY:-}
      RESEND_API_KEY:         ${RESEND_API_KEY:-}
      OTEL_SERVICE_NAME:                northstar-api
      OTEL_EXPORTER_OTLP_ENDPOINT:     http://jaeger:4318
    depends_on:
      postgres:
        condition: service_healthy
      ai-agents:
        condition: service_healthy
    healthcheck:
      test:         ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval:     10s
      timeout:      5s
      retries:      5
      start_period: 20s

  # ─── NorthStar Express Server (nuovo — apps/server/) ───────────────────
  northstar-server:
    build:
      context:    .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT:                  3001
      # Step 5: NODE_ENV=development in dev, sovrascrivere in prod
      NODE_ENV:              ${NODE_ENV:-development}
      DATABASE_URL:          postgresql://${POSTGRES_USER:-northstar}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-northstar}
      REDIS_URL:             redis://:${REDIS_PASSWORD}@redis:6379
      PROFILE_CACHE_TTL_SECONDS: ${PROFILE_CACHE_TTL_SECONDS:-300}
      JWT_SECRET:            ${JWT_SECRET}
      JWT_EXPIRES_IN:        ${JWT_EXPIRES_IN:-7d}
      OPENAI_API_KEY:        ${OPENAI_API_KEY}
      OPENAI_MODEL:          ${OPENAI_MODEL:-gpt-4o-mini}
      STRIPE_SECRET_KEY:     ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # Step 5: ALLOWED_ORIGINS da env per override production
      ALLOWED_ORIGINS:       ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:5000}
      APP_URL:               ${APP_URL:-http://localhost:5173}
      AFFILIATE_COMMISSION_PCT:        ${AFFILIATE_COMMISSION_PCT:-20}
      AFFILIATE_MIN_WITHDRAWAL_EUR:    ${AFFILIATE_MIN_WITHDRAWAL_EUR:-10}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:         ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval:     10s
      timeout:      5s
      retries:      5
      start_period: 20s

  # ─── React Frontend ─────────────────────────────────────────────────────────
  # Nota: il frontend Vite (apps/web) viene servito da Replit in dev.
  # Questo servizio fa girare il frontend legacy (artifacts/orientamento)
  # o un eventuale build statico di apps/web.
  # Step 5: VITE_API_URL aggiornato per puntare al northstar-server (3001)
  # invece che solo al server legacy (8080).
  frontend:
    build:
      context:    ./artifacts/orientamento
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      # Nuovo server (porta 3001) — cambia in https://api.northstar.app in prod
      VITE_API_URL: ${VITE_API_URL:-http://northstar-server:3001/api}
    depends_on:
      northstar-server:
        condition: service_healthy

  # ─── Jaeger (distributed tracing UI) ──────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.57
    restart: unless-stopped
    ports:
      - "16686:16686"   # Jaeger UI
      - "4318:4318"     # OTLP HTTP
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

volumes:
  postgres_data:
