<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1"
    />
    <title>Fondazione NorthStar</title>
    <meta
      name="description"
      content="NorthStar è la piattaforma italiana di orientamento e crescita personale. Fai il test RIASEC + Cinque Spiriti, scopri i settori professionali adatti a te e costruisci il tuo percorso di carriera."
    />
    <meta
      name="keywords"
      content="orientamento scuola lavoro, test personalità carriera, crescita personale, piattaforma orientamento, settori professionali, mestieri del futuro, RIASEC, NorthStar"
    />
    <meta name="author" content="NorthStar" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://northstar.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NorthStar" />
    <meta
      property="og:title"
      content="NorthStar — Orientamento e Crescita Personale"
    />
    <meta
      property="og:description"
      content="Scopri la tua via. Test di personalità RIASEC + Cinque Spiriti, matching con 21 settori professionali e strumenti per costruire il tuo percorso."
    />
    <meta property="og:locale" content="it_IT" />
    <meta property="og:url" content="https://northstar.app/" />
    <meta property="og:image" content="https://northstar.app/opengraph.jpg" />
    <meta
      property="og:image:alt"
      content="NorthStar — Orientamento e Crescita Personale"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="NorthStar — Orientamento e Crescita Personale"
    />
    <meta
      name="twitter:description"
      content="Scopri la tua via. Test RIASEC + Cinque Spiriti, 21 settori professionali e strumenti di crescita personale."
    />
    <meta name="twitter:image" content="https://northstar.app/opengraph.jpg" />
    <meta
      name="twitter:image:alt"
      content="NorthStar — Orientamento e Crescita Personale"
    />

    <!-- PWA / Mobile -->
    <meta name="theme-color" content="#0d0d0d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="NorthStar" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      Resource hints
      ───────────────────────────────────────────────────────────────────
      preload: scaricamento in parallelo prima del parsing del bundle
      preconnect: handshake TLS anticipato verso le origini critiche
      dns-prefetch: risoluzione DNS per origini di terze parti
    -->

    <!-- Logo: usato immediatamente nel Navbar, deve arrivare prima di React -->
    <link rel="preload" href="/logo.svg" as="image" type="image/svg+xml" />

    <!-- Hero image: above-the-fold sulla home, alta priorità -->
    <link rel="preload" href="/hero.png" as="image" fetchpriority="high" />

    <!-- Inter latin subset: evita FOUT (flash of unstyled text) -->
    <link
      rel="preload"
      href="https://fonts.gstatic.com/s/inter/v19/UcCO3FwrK3iLTeHuS_nVMrMxCp50SjIw2boKoduKmMEVuLyfAZ9hiJ-Ek-_EeA.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- API origin: preconnect riduce la latenza delle prime chiamate fetch -->
    <link rel="preconnect" href="https://northstar.app" crossorigin />

    <!-- Clerk: preconnect riduce la latenza dell'inizializzazione auth -->
    <link rel="preconnect" href="https://clerk.com" />
    <link rel="preconnect" href="https://api.clerk.com" />
    <link rel="dns-prefetch" href="https://clerk.accounts.dev" />

    <!-- Google GSI: dns-prefetch sufficiente, il connect avviene già con il tag script -->
    <link rel="dns-prefetch" href="https://accounts.google.com" />

    <!-- Google Fonts: già preconnect sopra, aggiungiamo dns-prefetch per fallback -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />

    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
