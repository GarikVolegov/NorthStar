server {
    listen 5000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Abilita sendfile e ottimizzazioni TCP
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # ── GZIP ────────────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        application/manifest+json
        application/wasm
        image/svg+xml
        font/woff
        font/woff2;

    # ── SPA fallback ─────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options  nosniff;
        add_header X-Frame-Options         SAMEORIGIN;
        add_header Referrer-Policy         strict-origin-when-cross-origin;
    }

    # ── Asset statici (hash nel nome → immutable) ────────────────────────────
    location ~* \.(js|css|woff2|woff|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    # ── Immagini e icone ──────────────────────────────────────────────────────
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # ── HTML entry point: no cache (aggiornamenti app immediati) ─────────────
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma        "no-cache";
        add_header Expires       "0";
    }

    # ── Web App Manifest ──────────────────────────────────────────────────────
    location = /manifest.webmanifest {
        add_header Cache-Control "public, max-age=86400";
        add_header Content-Type  "application/manifest+json";
    }

    # ── Service Worker: no cache (deve sempre essere aggiornato) ─────────────
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
