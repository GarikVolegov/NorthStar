name: Deploy Staging

# ─────────────────────────────────────────────────────────────────────────────
# Trigger: ogni push su branch develop
# Jobs in sequenza:
#   typecheck → unit-tests → db-migrate → health-check → deploy
#
# Secret richiesti (GitHub Environment "staging"):
#   STAGING_DATABASE_URL
#   STAGING_DATABASE_URL_MIGRATOR
#   STAGING_JWT_SECRET
#   STAGING_ADMIN_KEY
#   RAILWAY_STAGING_API_TOKEN   (o FLY_API_TOKEN per Fly.io)
#   RAILWAY_STAGING_SERVICE_ID  (ID servizio Railway)
#   SLACK_WEBHOOK_URL           (opzionale — notifiche)
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [develop]

# Una sola run alla volta per staging — cancella la precedente se c'è
concurrency:
  group: staging-deploy
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  # ─── 1. Typecheck ───────────────────────────────────────────────────────────
  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "store=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: pnpm-store-${{ runner.os }}-${{ env.PNPM_VERSION }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-${{ env.PNPM_VERSION }}-

      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck

  # ─── 2. Unit tests ──────────────────────────────────────────────────────────
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "store=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: pnpm-store-${{ runner.os }}-${{ env.PNPM_VERSION }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-${{ env.PNPM_VERSION }}-

      - run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm --filter @workspace/api-server run test:unit
        env:
          NODE_ENV: test
          JWT_SECRET: ci-staging-jwt-secret-32-chars!
          ADMIN_KEY: ci-staging-admin-key
          USE_MOCK_AI: 'true'
          AI_MOCK_MODE: 'true'

  # ─── 3. DB Migration staging ─────────────────────────────────────────────────
  db-migrate:
    name: DB migration (staging)
    runs-on: ubuntu-latest
    needs: unit-tests
    environment: staging   # accede ai secret dell'environment GitHub
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "store=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: pnpm-store-${{ runner.os }}-${{ env.PNPM_VERSION }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-${{ env.PNPM_VERSION }}-

      - run: pnpm install --frozen-lockfile

      - name: Apply Drizzle migrations to staging DB
        run: pnpm --filter @workspace/db exec drizzle-kit push
        env:
          # Usa il ruolo migrator (DDL completo) — vedi DB_RULES.md
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL_MIGRATOR }}
          DATABASE_URL_MIGRATOR: ${{ secrets.STAGING_DATABASE_URL_MIGRATOR }}

  # ─── 4. Deploy ───────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Railway (staging)
    runs-on: ubuntu-latest
    needs: db-migrate
    environment: staging
    steps:
      - uses: actions/checkout@v4

      # ── Railway ──────────────────────────────────────────────────────────────
      # Decommentare il blocco Railway O il blocco Fly.io secondo provider scelto

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: |
          railway up \
            --service ${{ secrets.RAILWAY_STAGING_SERVICE_ID }} \
            --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_STAGING_API_TOKEN }}

      # ── Fly.io (alternativa) ────────────────────────────────────────────────
      # - name: Deploy to Fly.io
      #   uses: superfly/flyctl-actions/setup-flyctl@master
      # - run: flyctl deploy --remote-only --config fly.staging.toml
      #   env:
      #     FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # ─── Health check post-deploy ────────────────────────────────────────────
      - name: Wait for staging to be healthy
        run: |
          echo "Attendo che staging risponda su /api/health..."
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              "${{ vars.STAGING_URL }}/api/health" 2>/dev/null || echo "000")
            echo "Tentativo $i/12 — HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✅ Staging healthy!"
              exit 0
            fi
            sleep 10
          done
          echo "❌ Staging non risponde dopo 2 minuti"
          exit 1

      # ─── Notifica Slack (opzionale) ──────────────────────────────────────────
      - name: Notify Slack — deploy OK
        if: success() && vars.SLACK_NOTIFY == 'true'
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "✅ *NorthStar Staging* deploy completato\n*Branch*: `${{ github.ref_name }}`\n*Commit*: `${{ github.sha }}`\n*By*: ${{ github.actor }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Notify Slack — deploy FAILED
        if: failure() && vars.SLACK_NOTIFY == 'true'
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "🔴 *NorthStar Staging* deploy FALLITO\n*Branch*: `${{ github.ref_name }}`\n*Commit*: `${{ github.sha }}`\n*Job*: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
