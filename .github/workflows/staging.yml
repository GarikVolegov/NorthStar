name: Deploy Staging

# ─────────────────────────────────────────────────────────────────────────────
# Trigger: ogni push su branch develop
# Jobs in sequenza:
#   typecheck → unit-tests → db-migrate → deploy (con Sentry release)
#
# Secret richiesti (GitHub Environment "staging"):
#   STAGING_DATABASE_URL
#   STAGING_DATABASE_URL_MIGRATOR
#   STAGING_JWT_SECRET
#   STAGING_ADMIN_KEY
#   RAILWAY_STAGING_API_TOKEN
#   RAILWAY_STAGING_SERVICE_ID
#   SENTRY_AUTH_TOKEN         ← Fase 3: token Sentry con scope releases:write
#   SLACK_WEBHOOK_URL         (opzionale)
#
# Variabili (GitHub Environment "staging"):
#   STAGING_URL               es. https://staging.northstar.app
#   SENTRY_ORG                slug dell'organizzazione su sentry.io
#   SENTRY_PROJECT            slug del progetto su sentry.io
#   SLACK_NOTIFY              'true' per abilitare notifiche Slack
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [develop]

concurrency:
  group: staging-deploy
  cancel-in-progress: true

env:
  NODE_VERSION: "20.10.x"
  PNPM_VERSION: "11.0.9"

jobs:
  # ─── 1. Typecheck ───────────────────────────────────────────────────────────
  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
      - run: pnpm run typecheck

  # ─── 2. Unit tests ──────────────────────────────────────────────────────────
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Run web tests
        run: pnpm --filter @northstar/web run test
        env:
          NODE_ENV: test

      - name: Run AI server tests
        run: pnpm --filter @workspace/ai-server run test
        env:
          NODE_ENV: test
          USE_MOCK_AI: "true"

      - name: Frontend API fetch guard
        run: pnpm run audit:api-fetch

      - name: Mojibake guard
        run: pnpm run audit:mojibake

      - name: Dependency audit
        run: pnpm audit --prod --audit-level=high

  # ─── 3. DB Migration staging ─────────────────────────────────────────────────
  db-migrate:
    name: DB migration (staging)
    runs-on: ubuntu-latest
    needs: unit-tests
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Apply Drizzle migrations to staging DB
        run: pnpm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL_MIGRATOR }}
          DATABASE_URL_MIGRATOR: ${{ secrets.STAGING_DATABASE_URL_MIGRATOR }}

  # ─── 4. Deploy + Sentry Release ──────────────────────────────────────────────
  deploy:
    name: Deploy to Railway (staging)
    runs-on: ubuntu-latest
    needs: db-migrate
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # necessario per sentry-cli set-commits --auto

      - name: Set SENTRY_RELEASE
        run: echo "SENTRY_RELEASE=staging@$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Install Railway CLI
        run: npm install -g @railway/cli --silent

      - name: Deploy to Railway
        run: |
          railway up \
            --service ${{ secrets.RAILWAY_STAGING_SERVICE_ID }} \
            --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_STAGING_API_TOKEN }}

      # Sentry release per staging — permette di correlare errori staging con commit
      - name: Create Sentry release (staging)
        run: |
          npm install -g @sentry/cli --silent
          sentry-cli releases new "$SENTRY_RELEASE"
          sentry-cli releases set-commits "$SENTRY_RELEASE" --auto
          sentry-cli releases finalize "$SENTRY_RELEASE"
          sentry-cli releases deploys "$SENTRY_RELEASE" new \
            --env staging \
            --name "$(git rev-parse --short HEAD)" \
            --url "${{ vars.STAGING_URL }}"
          echo "✅ Sentry release $SENTRY_RELEASE"
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}

      - name: Wait for staging to be healthy
        run: |
          echo "Attendo che staging risponda su /api/health..."
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              "${{ vars.STAGING_URL }}/api/health" 2>/dev/null || echo "000")
            echo "Tentativo $i/12 — HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✅ Staging healthy!"
              exit 0
            fi
            sleep 10
          done
          echo "❌ Staging non risponde dopo 2 minuti"
          exit 1

      - name: Notify Slack — deploy OK
        if: success() && vars.SLACK_NOTIFY == 'true'
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "✅ *NorthStar Staging* deploy completato\n*Branch*: `${{ github.ref_name }}`\n*Release*: `${{ env.SENTRY_RELEASE }}`\n*By*: ${{ github.actor }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Notify Slack — deploy FAILED
        if: failure() && vars.SLACK_NOTIFY == 'true'
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "🔴 *NorthStar Staging* deploy FALLITO\n*Branch*: `${{ github.ref_name }}`\n*Release*: `${{ env.SENTRY_RELEASE }}`\n*Job*: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
