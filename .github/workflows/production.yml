name: Deploy Production

# ─────────────────────────────────────────────────────────────────────────────
# Trigger: ogni push su main (merge di una PR da develop)
# Jobs in sequenza:
#   typecheck → unit-tests → db-migrate-prod → deploy-prod → sentry-release-prod
#
# Secret richiesti (GitHub Environment "production"):
#   PRODUCTION_DATABASE_URL_MIGRATOR  ← ruolo DDL per migration runner
#   PRODUCTION_JWT_SECRET
#   PRODUCTION_ADMIN_KEY
#   RAILWAY_PROD_API_TOKEN
#   RAILWAY_PROD_SERVICE_ID
#   SENTRY_AUTH_TOKEN                 ← token con scope releases:write
#   SLACK_WEBHOOK_URL                 (opzionale)
#
# Variabili (GitHub Environment "production"):
#   PRODUCTION_URL                    es. https://api.northstar.app
#   SENTRY_ORG                        slug org Sentry
#   SENTRY_PROJECT                    slug progetto Sentry
#   SLACK_NOTIFY                      'true' per abilitare notifiche
#
# Protezioni consigliate sull'Environment "production" in GitHub:
#   ✔ Required reviewers: 1 (almeno un approvatore prima del deploy)
#   ✔ Deployment branches: main only
#   ✔ Wait timer: 0 min (Railway gestisce il rollout graduale)
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false # MAI cancellare un deploy prod in corso

env:
  NODE_VERSION: "20.10.x"
  PNPM_VERSION: "11.0.9"

jobs:
  # ─── 1. Typecheck ───────────────────────────────────────────────────────────
  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
      - run: pnpm run typecheck

  # ─── 2. Unit tests ──────────────────────────────────────────────────────────
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Run web tests
        run: pnpm --filter @northstar/web run test
        env:
          NODE_ENV: test

      - name: Run AI server tests
        run: pnpm --filter @workspace/ai-server run test
        env:
          NODE_ENV: test
          USE_MOCK_AI: "true"

      - name: Frontend API fetch guard
        run: pnpm run audit:api-fetch

      - name: Mojibake guard
        run: pnpm run audit:mojibake

      - name: Dependency audit
        run: pnpm audit --prod --audit-level=high

  # ─── 3. DB Migration production ──────────────────────────────────────────────
  # ⚠️  Questo job modifica il DB di produzione.
  # Usa SEMPRE il ruolo migrator (DDL completo) — mai il ruolo app (solo DML).
  # La migration è idempotente: il runner Drizzle applica solo migration SQL pending.
  db-migrate-prod:
    name: DB migration (production)
    runs-on: ubuntu-latest
    needs: unit-tests
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Dry-run Drizzle migrations for production DB
        run: pnpm run db:migrate:dry-run
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL_MIGRATOR }}
          DATABASE_URL_MIGRATOR: ${{ secrets.PRODUCTION_DATABASE_URL_MIGRATOR }}

      - name: Apply Drizzle migrations to production DB
        run: pnpm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL_MIGRATOR }}
          DATABASE_URL_MIGRATOR: ${{ secrets.PRODUCTION_DATABASE_URL_MIGRATOR }}

  # ─── 4. Deploy production ─────────────────────────────────────────────────────
  deploy-prod:
    name: Deploy to Railway (production)
    runs-on: ubuntu-latest
    needs: db-migrate-prod
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set SENTRY_RELEASE
        run: echo "SENTRY_RELEASE=production@$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Install Railway CLI
        run: npm install -g @railway/cli --silent

      - name: Deploy to Railway (production)
        run: |
          railway up \
            --service ${{ secrets.RAILWAY_PROD_SERVICE_ID }} \
            --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_PROD_API_TOKEN }}

      - name: Wait for production to be healthy
        run: |
          echo "Attendo che production risponda su /api/health..."
          for i in $(seq 1 18); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              "${{ vars.PRODUCTION_URL }}/api/health" 2>/dev/null || echo "000")
            echo "Tentativo $i/18 — HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✅ Production healthy!"
              exit 0
            fi
            sleep 10
          done
          echo "❌ Production non risponde dopo 3 minuti"
          exit 1

      - name: Notify Slack — deploy OK
        if: success() && vars.SLACK_NOTIFY == 'true'
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "✅ *NorthStar Production* deploy completato\n*Release*: `${{ env.SENTRY_RELEASE }}`\n*By*: ${{ github.actor }}\n*URL*: ${{ vars.PRODUCTION_URL }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Notify Slack — deploy FAILED
        if: failure() && vars.SLACK_NOTIFY == 'true'
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "🔴 *NorthStar Production* deploy FALLITO\n*Release*: `${{ env.SENTRY_RELEASE }}`\n*Job*: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  # ─── 5. Sentry Release production ────────────────────────────────────────────
  # Gira DOPO il deploy riuscito. Se il deploy fallisce, non creiamo la release
  # Sentry (evita falsi positivi nel regression tracking).
  sentry-release-prod:
    name: Sentry release (production)
    runs-on: ubuntu-latest
    needs: deploy-prod
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create & finalize Sentry release
        run: |
          npm install -g @sentry/cli --silent
          RELEASE="production@$(git rev-parse --short HEAD)"
          echo "Creando release Sentry: $RELEASE"

          sentry-cli releases new "$RELEASE"
          sentry-cli releases set-commits "$RELEASE" --auto
          sentry-cli releases finalize "$RELEASE"
          sentry-cli releases deploys "$RELEASE" new \
            --env production \
            --name "$(git rev-parse --short HEAD)" \
            --url "${{ vars.PRODUCTION_URL }}"

          echo "✅ Sentry release $RELEASE finalizzata"
          echo "  → Dashboard: https://sentry.io/organizations/${{ vars.SENTRY_ORG }}/releases/$RELEASE/"
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
