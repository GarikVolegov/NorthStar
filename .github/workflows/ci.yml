name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── 1. Typecheck ────────────────────────────────────────────────────────────
  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck

  # ─── 2. Unit test (Vitest) ───────────────────────────────────────────────────
  unit-tests:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: Run Vitest unit tests
        run: pnpm --filter @workspace/api-server run test:unit
        env:
          NODE_ENV: test
          JWT_SECRET: ci-jwt-secret-32-chars-minimum!
          ADMIN_KEY: ci-admin-key
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-coverage
          path: artifacts/api-server/coverage/
          retention-days: 7

  # ─── 3. Integration test (Supertest) ────────────────────────────────────────
  integration-tests:
    name: Integration tests (Supertest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: northstar
          POSTGRES_PASSWORD: northstar
          POSTGRES_DB: northstar_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: Run DB migrations
        run: pnpm --filter @workspace/db exec drizzle-kit push
        env:
          DATABASE_URL: postgresql://northstar:northstar@localhost:5432/northstar_test
      - name: Run Vitest integration tests
        run: pnpm --filter @workspace/api-server run test:integration
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://northstar:northstar@localhost:5432/northstar_test
          JWT_SECRET: ci-jwt-secret-32-chars-minimum!
          ADMIN_KEY: ci-admin-key
          AI_AGENTS_URL: http://localhost:8000

  # ─── 4. E2E test (Playwright) ────────────────────────────────────────────────
  e2e-tests:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]  # E2E solo se unit+integration passano
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: northstar
          POSTGRES_PASSWORD: northstar
          POSTGRES_DB: northstar_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Run DB migrations
        run: pnpm --filter @workspace/db exec drizzle-kit push
        env:
          DATABASE_URL: postgresql://northstar:northstar@localhost:5432/northstar_e2e
      - name: Build API server
        run: pnpm --filter @workspace/api-server run build
      - name: Start services
        run: |
          PORT=8080 DATABASE_URL=postgresql://northstar:northstar@localhost:5432/northstar_e2e \
          JWT_SECRET=ci-jwt-secret-32-chars-minimum! ADMIN_KEY=ci-admin-key \
          AI_AGENTS_URL=http://localhost:8000 \
          node artifacts/api-server/dist/index.mjs &

          PORT=5000 pnpm --filter @workspace/orientamento run build
          pnpm exec serve -s artifacts/orientamento/dist -l 5000 &

          # Aspetta che i servizi siano pronti
          npx wait-on http://localhost:8080/api/health http://localhost:5000 --timeout 60000
      - name: Run Playwright E2E
        run: pnpm test:e2e
        env:
          BASE_URL: http://localhost:5000
          API_URL: http://localhost:8080
          CI: true
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
