name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ─── 1. TypeScript typecheck ─────────────────────────────────────────────────
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm run typecheck

  # ─── 2. Python AI service tests ──────────────────────────────────────────────
  python-tests:
    name: Python AI Service Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts/ai-agents
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio httpx anyio

      - name: Run AI microservice tests
        run: pytest tests/ -v --tb=short
        env:
          AI_INTEGRATIONS_OPENAI_API_KEY: test-key-not-used-in-unit-tests
          AI_INTEGRATIONS_OPENAI_BASE_URL: http://localhost:9999

  # ─── 3. Docker image builds ──────────────────────────────────────────────────
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API server image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: artifacts/api-server/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build AI agents image
        uses: docker/build-push-action@v5
        with:
          context: artifacts/ai-agents
          file: artifacts/ai-agents/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: artifacts/orientamento
          file: artifacts/orientamento/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── 4. E2E tests ────────────────────────────────────────────────────────────
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [typecheck, python-tests]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: northstar
          POSTGRES_PASSWORD: northstar_dev
          POSTGRES_DB: northstar
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run DB migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgresql://northstar:northstar_dev@localhost:5432/northstar

      - name: Run E2E tests
        run: pnpm test:e2e:all
        env:
          DATABASE_URL: postgresql://northstar:northstar_dev@localhost:5432/northstar
          JWT_SECRET: ci-test-secret-min-32-chars-xxxxxxxxxx
          ADMIN_KEY: ci-test-admin-key-min-32-chars-xx
          AI_AGENTS_URL: http://localhost:8000
          NODE_ENV: test
          PORT: 8080
          BASE_URL: http://localhost:5000
          API_URL: http://localhost:8080

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
