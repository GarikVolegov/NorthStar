name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20.10.x"
  PNPM_VERSION: "11.0.9"

jobs:
  audit:
    name: Security audit
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Dependency audit
        run: pnpm audit --prod --audit-level=high

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Snyk audit
        if: ${{ env.SNYK_TOKEN != '' }}
        run: pnpm dlx snyk test --all-projects

      - name: Snyk skipped
        if: ${{ env.SNYK_TOKEN == '' }}
        run: echo "SNYK_TOKEN is not configured; skipping optional Snyk audit."

  quality:
    name: Typecheck, tests, audits, build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: audit
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20.10.x", "24.x"]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Required quality gate
        run: pnpm run quality:required
        env:
          NODE_ENV: test
          JWT_SECRET: ci-jwt-secret-for-github-actions-32chars
          USE_MOCK_AI: "true"

      - name: Web production build
        run: pnpm --filter @northstar/web run build

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            apps/web/coverage
            apps/server/coverage
            packages/ai-server/coverage
          if-no-files-found: ignore

  e2e:
    name: E2E API and browser (Playwright)
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: northstar
          POSTGRES_PASSWORD: northstar
          POSTGRES_DB: northstar_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        run: pnpm exec playwright install chromium

      - name: Run DB migrations
        run: pnpm --filter @workspace/db exec drizzle-kit push
        env:
          DATABASE_URL: postgresql://northstar:northstar@localhost:5432/northstar_e2e

      - name: Build server
        run: pnpm --filter @northstar/server run build

      - name: Start API server
        run: |
          PORT=3001 \
          DATABASE_URL=postgresql://northstar:northstar@localhost:5432/northstar_e2e \
          JWT_SECRET=CiJwtValue9f47b63a2d81ZetaAlpha! \
          ADMIN_KEY=ci-admin-key \
          USE_MOCK_AI=true \
          OPENAI_API_KEY=mock-not-used \
          ANTHROPIC_API_KEY=mock-not-used \
          GROQ_API_KEY=mock-not-used \
          SENTRY_DSN="" \
          pnpm --filter @northstar/server exec tsx src/index.ts &

          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3001/api/health/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          echo "Server did not become healthy"
          exit 1

      - name: Start web app
        run: |
          VITE_PORT=5000 pnpm --filter @northstar/web exec vite --config vite.config.ts --host 0.0.0.0 --port 5000 &

          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5000/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          echo "Web app did not become healthy"
          exit 1

      - name: Runtime quality gate
        run: pnpm run quality:runtime
        env:
          API_URL: http://localhost:3001
          BASE_URL: http://localhost:5000
          CI: "true"

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
